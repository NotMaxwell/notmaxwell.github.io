<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post Title — Maxwell McCormick</title>
  <meta name="description" content="Post excerpt or summary." />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/site.css" />
  <style>
    article{max-width:70ch}
    .post-meta{color:var(--faint); font-size:14px; margin:0 0 2em; font-family:var(--mono)}
    .post-content h2{margin:1.8em 0 .5em; font-size:24px; letter-spacing:-.01em}
    .post-content h3{margin:1.4em 0 .4em; font-size:19px}
    .post-content p{margin:1em 0}
    .post-content ul, .post-content ol{margin:1em 0; padding-left:1.5em}
    .post-content li{margin:.4em 0}
    .post-content blockquote{margin:1.2em 0; padding:2px 0 2px 16px;
      border-left:2px solid var(--line-hi); color:var(--muted)}
    .post-content code{background:rgba(255,255,255,.06); padding:2px 6px;
      border-radius:4px; font-family:var(--mono); font-size:.9em}
    .post-content pre{background:rgba(0,0,0,.3); padding:14px; border-radius:var(--radius-sm);
      overflow-x:auto; border:1px solid var(--line)}
    .post-content pre code{background:none; padding:0; font-size:13.5px}
    .post-content a{color:var(--accent)}
    .post-content img{border-radius:var(--radius-sm); border:1px solid var(--line)}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true"></span>
        <span>Maxwell McCormick</span>
      </a>
      <nav aria-label="Primary">
        <a href="/projects/">Projects</a>
        <a href="/posts/">Blog</a>
        <a href="/#about">About</a>
        <a href="/#contact">Contact</a>
        <a href="https://github.com/NotMaxwell" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    <article id="main">
      <header>
        <h1>Post Title Goes Here</h1>
        <p class="post-meta">Jan 12, 2026 · 5 min read</p>
      </header>

      <main class="post-content">
        <p>Post body goes here. <code>convert.py</code> replaces everything between these tags.</p>
      </main>
    </article>

    <footer class="foot">
      <div><a href="/posts/">← All posts</a></div>
      <div>© <span id="year">2026</span> Maxwell McCormick</div>
    </footer>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
